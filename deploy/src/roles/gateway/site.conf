# nginx 的站点配置。交给宿主机的 nginx 用。
#
# 这里写的是「外面的路径 -> 哪个服务名」，不写任何 IP 和端口。
# 服务背后有几台机器、IP 是什么，全在 backends.conf 里自动生成，不用管这里。

server {
    listen      __SITE_PORT__;
    server_name _;

    location /api/demo/ {
        proxy_pass http://__SERVICE_NAME__/;   # 末尾的 / 会把 /api/demo/ 这一段去掉
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
