# 角色二：网关侧的「后端地址表生成器」
# 真正转发流量的是宿主机 nginx：匹配规则和 proxy_pass 在 consul-demo.conf 里，
# 后端地址表就是本容器写出到 conf.d 的那个 backends.conf。
# 这里只盯注册中心重写地址表，不接管任何请求；改完由 deploy.sh 触发 nginx reload。
# 加机器、删机器都不用改这里——地址列表是自动生成的。
name: consul-demo-gateway

services:
  generator:
    image: hashicorp/consul-template:0.39.1
    container_name: consul-demo-generator
    restart: unless-stopped
    network_mode: host
    user: root                # 镜像默认用户写不了卷目录，必须给 root
    command:
      # 从注册中心拉服务列表
      - "-consul-addr=${REGISTRY_HOSTPORT}"
      # 模板 -> 生成 nginx 用的后端地址列表；只写文件，不碰 nginx 进程
      # 输出位置就是 nginx 的 include 目录（config.ini 里的 NGINX_CONF_DIR）
      - "-template=./backends.ctmpl:/conf/backends.conf"
    environment:
      # 模板里用它决定 upstream 叫什么，必须和 nginx 的 proxy_pass 一致
      - SERVICE_NAME=${SERVICE_NAME}
    volumes:
      - ./:/work
      - ${NGINX_CONF_DIR}:/conf
    working_dir: /work
