# ============================================================
#  HAProxy —— 只管一件事：知道哪台 k3s 节点还活着
#
#  拓扑：
#     client → nginx:8080 → 127.0.0.1:8081 (本文件) → 10.0.3.{8,9,10}:30080
#
#  端口约定（80 留给系统 nginx 原始配置，不动）：
#     8080  nginx 新入口，对外
#     8081  HAProxy 前端，只绑回环，只给本机 nginx 用
#     8404  HAProxy stats，只绑回环，由 nginx 的 /haproxy-status 反代出去
#
#  部署位置：10.0.3.11
# ============================================================

global
    log /dev/log local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull

    # timeout connect 短：节点整机消失（SYN 被丢）时靠它快速判失败后重试。
    timeout connect 300ms

    # timeout server 必须短！
    # 这是本次漏 1 次失败的真正元凶：Pod 被删后 kube-proxy 的 iptables 规则
    # 还会残留 1~2 秒，请求被 DNAT 到一个已经不存在的 Pod IP —— TCP 能连上
    # （连的是 kube-proxy），但一个字节都不会回来。curl 报的就是
    # "0 bytes received"。这时 timeout connect 完全用不上，只有 timeout server 生效。
    #
    # demo 业务 3ms，2s 足够。真实长业务要单开 backend 并放大这个值（见 DEPLOY.md）。
    timeout server  2s

    timeout client  60s

    # retry-on 让「响应超时 / 空响应」也能重试到别的 server，
    # 默认只在连接失败时重试，救不了上面那种黑洞场景。
    retries 3
    retry-on conn-failure empty-response response-timeout

# ------------------------------------------------------------------
# 前端：只监听回环。不绑 0.0.0.0，避免绕过 nginx 直连
# ------------------------------------------------------------------
frontend fe_consul_demo
    bind 127.0.0.1:8081

    # 三层代理，必须由 HAProxy 追加 XFF，否则后端只能看到 127.0.0.1
    option forwardfor

    default_backend be_consul_demo

# ------------------------------------------------------------------
# 后端：主动健康检查
#   inter 500ms   正常每 0.5 秒探一次
#   fastinter     探测失败一次后 200ms 补探，摘除最快约 0.7 秒
#   fall 2        连续 2 次失败 → 标记 down
#   rise 2        连续 2 次成功 → 标记 up
#
#   http-check expect status 200 必须写！
#   只写 option httpchk 时 2xx/3xx 都算健康，应用 302 到登录页也会判活。
# ------------------------------------------------------------------
backend be_consul_demo
    option httpchk GET /healthz
    http-check expect status 200

    # retries / retry-on 已在 defaults 里统一配好（3 次 + 响应超时也重试）
    option redispatch

    # inter   正常情况每 500ms 探一次
    # fastinter  探测刚失败一次时，立刻 200ms 后补探 → 摘除窗口从 2s 压到约 0.7s
    # downinter  已判 DOWN 后 1s 探一次，恢复更快
    # fall/rise  连续 2 次失败才摘、2 次成功才回，避免单次抖动误摘
    default-server inter 500ms fastinter 200ms downinter 1s fall 2 rise 2

    server k3s-1 10.0.3.8:30080  check
    server k3s-2 10.0.3.9:30080  check
    server k3s-3 10.0.3.10:30080 check

# ------------------------------------------------------------------
# 状态页：经 nginx 的 /haproxy-status 访问
#   uri 与 nginx 的 location 路径前缀保持一致，页内相对链接才不会断
# ------------------------------------------------------------------
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /haproxy-status
    stats refresh 2s
    stats show-legends
