# ============================================================
#  nginx 入口 —— 监听 8080，反代到 k3d 的 serverlb
#
#  放置位置：/etc/nginx/conf.d/consul-demo.conf
#  系统默认的 80 完全不碰。
#
#  链路：
#    client → nginx:8080 → 127.0.0.1:8081 (k3d-demo-serverlb) → 节点 30080 → Pod
# ============================================================

upstream k3d_lb {
    server 127.0.0.1:8081;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/consul-demo.access.log;
    error_log  /var/log/nginx/consul-demo.error.log;

    location / {
        proxy_pass http://k3d_lb;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1s;
        proxy_read_timeout    60s;

        # 上游只有一个（serverlb），这里只留一次兜底重发
        proxy_next_upstream       error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
