# ============================================================
#  nginx/consul-demo.conf —— 入口 server 段
#
#  这份文件只定义「怎么转发」，不定义「转给谁」。
#  upstream 由脚本生成在 /etc/nginx/conf.d/00-upstream-consul-demo.conf，
#  扩容时只重写那个文件，这里一个字节都不改。
#
#  监听 8080，不碰 80。
# ============================================================
server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/consul-demo.access.log;
    error_log  /var/log/nginx/consul-demo.error.log;

    location / {
        proxy_pass http://consul_demo;

        # keepalive 必须配 1.1 + 清空 Connection，否则 upstream 的
        # keepalive 32 完全不生效，每个请求都重新三次握手。
        proxy_http_version 1.1;
        proxy_set_header Connection        "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 连节点端口是本机/同网段内网，握手很快，1 秒足够。
        proxy_connect_timeout 1s;

        # 这个才是「业务耗时上限」。60s 的慢接口会被它切断，
        # 真有长任务时按路径拆一个独立 location，不要全局放宽。
        proxy_read_timeout 60s;

        # 节点整机消失的瞬间，第一个请求会失败：
        #   - Local 模式下该节点没有 Pod，kube-proxy 直接 REJECT
        #     → 表现为 error，能立刻被 next_upstream 捕获
        #   - 残留 iptables 指向已删 Pod 时 → 表现为 timeout
        # 两种都列进来，再试一次基本就落到存活节点上。
        proxy_next_upstream        error timeout http_502 http_503;
        proxy_next_upstream_tries  2;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
