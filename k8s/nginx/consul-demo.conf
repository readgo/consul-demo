# ============================================================
#  nginx 新增 server —— 新入口 8080，系统默认的 80 完全不碰
#
#  放置位置：/etc/nginx/conf.d/consul-demo.conf
#  Ubuntu 的 nginx.conf 里本来就有 include /etc/nginx/conf.d/*.conf;
#  所以放进去 reload 即生效，不需要改 sites-enabled 里的任何文件。
#
#  拓扑：
#     client → nginx:8080 ─┬─ /haproxy-status   → 127.0.0.1:8404
#                          └─ /                 → 127.0.0.1:8081 (HAProxy)
#                                                    └─ 主动检查 → 30080 × 3
# ============================================================

upstream haproxy_local {
    server 127.0.0.1:8081;

    # 回环连接复用。配了 keepalive 就必须同时设 proxy_http_version 1.1
    # 和 Connection ""，否则连接不会复用
    keepalive 64;
}

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/consul-demo.access.log;
    error_log  /var/log/nginx/consul-demo.error.log;

    # ---------------- HAProxy 状态页 ----------------
    # uri 与 haproxy.cfg 里的 stats uri 一致，页内相对链接才不会断
    location /haproxy-status {
        proxy_pass http://127.0.0.1:8404;
        proxy_set_header Host $host;
    }

    # ---------------- 业务入口 ----------------
    location / {
        proxy_pass http://haproxy_local;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 连本机 HAProxy，握手应该极快
        proxy_connect_timeout 1s;

        # 只读超时会杀长业务。demo 是毫秒级；真实业务按最长耗时留余量
        proxy_read_timeout 60s;

        # 重试职责主要交给 HAProxy（它知道哪台后端健康）。
        # 这里保留一次兜底重试：节点消失的瞬间，HAProxy 可能还在 2 次失败判定中，
        # 那一次连接会失败；重发一次时 HAProxy 通常已经把死节点摘掉了。
        #
        # 注意：上游只有一个，tries 2 = 最多重发 1 次。
        # 如果业务里有非幂等 POST 写操作，要改成按 $request_method 区分（见 DEPLOY.md）。
        proxy_next_upstream       error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # 供外部探 nginx 自己活着，不打后端
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
