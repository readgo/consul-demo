# ============================================================
#  consul-demo 的前置入口（跑在第 4 台 VM 10.0.3.11 上）
#
#  作用：把 3 个节点的 NodePort 当成 3 个上游，谁连不上就立刻不给它派活。
#
#  为什么需要这一层：
#    k8s 发现「整台机器消失」要等 node-monitor-grace-period（默认 40s）
#    + EndpointSlice 收敛（约 10s），实测窗口 51 秒，期间约 1/3 请求
#    超时 3 秒才放弃。nginx 直连节点端口后，这个窗口被压到 800ms 以内。
#
#  前提（缺一不可）：
#    1) Service 必须 externalTrafficPolicy: Local（见 ../app.yml）
#       否则节点端口会把探测请求 DNAT 到别的节点上的 Pod，探了等于没探。
#    2) 每个节点上都得有 Pod（当前 topologySpreadConstraints 已保证 1-1-1）
#
#  关于「主动健康检查」：
#    开源 nginx **没有** health_check 指令（那是 Nginx Plus 商业版的功能，
#    开源版写了会直接起不来）。这里用的是「被动检查 + 失败重试」：
#      关节点瞬间 → 第 1 个打中它的请求等 800ms，nginx 内部重试到健康节点，
#                    客户端拿到的仍是 200（不会看到失败，只慢一点点）
#      之后 5 秒  → 该上游标记为 down，直接跳过，连 800ms 都不用花
#      每 5 秒    → 试探性恢复一次，死节点最多让 1 个请求多等 800ms
#    想彻底消掉这 800ms，换 HAProxy 或 Tengine 做真主动探测
#    （inter 1s fall 2 rise 2，2 秒内摘干净）。
# ============================================================

upstream consul_demo {
    server 10.0.3.8:30080  max_fails=1 fail_timeout=5s;
    server 10.0.3.9:30080  max_fails=1 fail_timeout=5s;
    server 10.0.3.10:30080 max_fails=1 fail_timeout=5s;

    # 复用后端连接，省掉每个请求的三次握手。
    # 用了 keepalive 就必须同时在下面设 proxy_http_version 1.1 + Connection ""，
    # 否则连接无法复用，配了等于没配。
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/consul-demo.access.log;
    error_log  /var/log/nginx/consul-demo.error.log warn;

    location / {
        proxy_pass http://consul_demo;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 最关键的一行：默认 60 秒。机器关机后 SYN 无人应答，默认配置会
        # 一直挂到 60 秒才放弃，那就完全失去意义了。压到 800ms。
        proxy_connect_timeout 800ms;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;

        # 连接失败 / 超时 / 502 / 503 时，nginx 内部换下一个上游重试。
        # 这是「客户端看不到失败」的关键——重试对客户端透明。
        proxy_next_upstream         error timeout http_502 http_503;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 3s;
    }

    # 探活用，不打后端。宿主机和监控脚本可以用这个确认 nginx 自己活着。
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
