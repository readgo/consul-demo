# ============================================================
#  consul-demo 前置入口 —— Tengine 版（主动健康检查）
#
#  放在第 4 台 VM 10.0.3.11，安装路径 /usr/local/tengine
#  与 ../nginx/consul-demo.conf（开源 nginx 被动检查版）二选一，
#  两者都占 80 端口，不能同时跑。
#
#  两版的核心差别：
#    开源 nginx  → 被动检查：等真实请求失败才发现（每 5 秒最多 1 个请求慢 800ms）
#    Tengine     → 主动检查：每 1 秒探一次 /healthz，连续 2 次失败即摘除，
#                  此时真实请求**一次都不会打到死节点**，客户端连 800ms 的慢都感知不到
#
#  前提（缺一不可）：
#    1) Service 必须 externalTrafficPolicy: Local（见 ../app.yml）
#       否则节点端口会把探测请求 DNAT 到别的节点上的 Pod，探了等于没探。
#    2) 每个节点上都得有 Pod（topologySpreadConstraints 已保证 1-1-1）
# ============================================================

worker_processes  auto;
pid               logs/tengine.pid;
error_log         logs/error.log warn;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # up=$upstream_addr 是排查的关键：能直接看出这个请求被转给了哪个节点
    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time '
                    'up=$upstream_addr st=$upstream_status ut=$upstream_response_time';
    access_log logs/access.log main;

    upstream consul_demo {
        server 10.0.3.8:30080;
        server 10.0.3.9:30080;
        server 10.0.3.10:30080;

        # ---- 主动健康检查（Tengine 自带模块，无需额外编译）----
        # interval=1000  每 1 秒探一次
        # fall=2         连续 2 次失败 → 标记 down（即最慢 2 秒摘除）
        # rise=2         连续 2 次成功 → 标记 up（即恢复后 2 秒回池）
        # timeout=1000   单次探测 1 秒内没响应算失败
        # type=http      必须显式写！默认是 tcp，只探端口通不通，
        #                应用返回 500 也会认为健康，等于没检查
        check interval=1000 rise=2 fall=2 timeout=1000 type=http;
        check_http_send "GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n";
        check_http_expect_alive http_2xx http_3xx;

        # 复用后端连接。配了 keepalive 就必须同时设 proxy_http_version 1.1 + Connection ""
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location / {
            proxy_pass http://consul_demo;

            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 有了主动检查，这个超时不再是「发现问题的手段」，只是兜底：
            # 万一 check 没来得及摘除，也最多让一个请求多等 1 秒。
            proxy_connect_timeout 1s;
            proxy_send_timeout    5s;
            proxy_read_timeout    5s;

            # 注意：慢接口（>5s）必须单独 location 并去掉 timeout 重试，
            # 否则会被重发到下一个节点导致业务重复执行，详见 README。
            proxy_next_upstream         error timeout http_502 http_503;
            proxy_next_upstream_tries   2;
        }

        # 供外部探 nginx 自己活着，不打后端
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Tengine 健康检查状态页：每个上游节点 up/down、失败计数一目了然
        location = /status {
            check_status;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.3.0/24;
            deny all;
        }
    }
}
