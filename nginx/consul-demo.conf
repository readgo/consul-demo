# =============================================================
#  consul-demo 的 nginx 站点配置 —— 手动复制用的参考件。
#
#  大多数情况不用碰它：sudo ./deploy.sh gateway 会先判定目标目录，
#  里面没有 consul-demo.conf 就按 config.ini 的 SITE_PORT / SERVICE_NAME
#  生成一份等价的。本文件是「想手动放进 conf.d」时用的默认值版本
#  （8088 / consul-demo），可以直接 cp。
#
#  目标目录怎么定（config.ini 的 NGINX_CONF_DIR 留空时）：
#    1. 默认 <当前用户家目录>/nginx/conf.d
#    2. 若 nginx 没有 include 这个默认目录，改用 nginx 自己的 conf.d
#  目标目录里已经有 consul-demo.conf 时，脚本不会覆盖它。
#
#  手动用法：
#
#      sudo cp nginx/consul-demo.conf <目标目录>/
#      sudo nginx -t && sudo nginx -s reload
#
#  用 deploy.sh gateway 时最后那步不用你敲：脚本会 nginx -t 通过后自己 reload
#  （nginx 没在跑就直接启动）。改动 nginx.conf 的事脚本一概不碰，那一行
#  include 由你手动加一次。
#
#  两个前提：
#
#    1. upstream 不在这里定义，它由 consul-template 从注册中心生成到
#       同目录的 backends.conf。deploy.sh gateway 会先补一份占位，
#       generator 起来后接管。两个文件必须在同一个被 include 的目录里。
#
#    2. 先有 backends.conf，再 reload。缺了它 nginx -t 依然通过（这点很坑），
#       但 proxy_pass http://consul-demo/ 会被当成域名去解析，
#       请求 502 或者打到别的主机上。upstream 名和这里的服务名必须一致。
#
#  改端口 / 服务名：优先改 config.ini 的 SITE_PORT / SERVICE_NAME，再删掉
#  已生成的 consul-demo.conf 重跑 deploy.sh gateway（它按新值重新生成）。
#  手工改本文件只影响你 cp 过去的副本。
# =============================================================

server {
    listen      8088;
    server_name _;

    location /api/demo/ {
        # 末尾的 / 会去掉 /api/demo/ 这一段：后端收到的是 /v1/xxx
        proxy_pass http://consul-demo/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ---- Consul 管理界面：/consul/（需要密码）----
    # 这段只在 config.ini 配了 CONSUL_LOGIN_PASS 时才会被自动生成。
    # 手工用本文件时，先把密码文件建好（脚本生成的那份长这样，一行）：
    #     admin:$apr1$xxxxxxxx$xxxxxxxxxxxxxxxxxxxxxx
    # 路径按你自己的 conf.d 目录改。
    location = /consul {
        return 301 /consul/;
    }

    location /consul/ {
        auth_basic           "consul demo";
        auth_basic_user_file /etc/nginx/conf.d/consul-demo.htpasswd;

        proxy_pass           http://127.0.0.1:8500;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $remote_addr;
        proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 界面用阻塞查询，单次请求最长挂 5 分钟，别让 nginx 先把它掐了
        proxy_read_timeout   330s;
        proxy_buffering      off;
    }

    # 界面里的接口调用写死成根路径 /v1/，同样要密码。
    # 业务接口走 /api/demo/，两者不冲突。
    location /v1/ {
        auth_basic           "consul demo";
        auth_basic_user_file /etc/nginx/conf.d/consul-demo.htpasswd;

        proxy_pass           http://127.0.0.1:8500;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_read_timeout   330s;
        proxy_buffering      off;
    }
}
